name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: masking-report
            asset_name: masking-report-linux-amd64
          - os: windows-latest
            artifact_name: masking-report.exe
            asset_name: masking-report-windows-amd64.exe
          - os: macos-latest
            artifact_name: masking-report
            asset_name: masking-report-macos-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build executable
        run: pyinstaller masking-report.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: masking-report-linux-amd64
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: masking-report-windows-amd64.exe
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: masking-report-macos-amd64
          path: artifacts/macos

      - name: Rename artifacts
        run: |
          mv artifacts/linux/masking-report artifacts/masking-report-linux-amd64
          mv artifacts/windows/masking-report.exe artifacts/masking-report-windows-amd64.exe
          mv artifacts/macos/masking-report artifacts/masking-report-macos-amd64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/masking-report-linux-amd64
            artifacts/masking-report-windows-amd64.exe
            artifacts/masking-report-macos-amd64
          generate_release_notes: true
